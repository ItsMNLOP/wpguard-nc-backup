name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly upstream-compatibility check, MNT-14

jobs:
  php-syntax-and-style:
    strategy:
      matrix:
        php: ['8.1', '8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, phpcs, phpstan
          extensions: mbstring, zip, mysqli, curl
      - name: Lint PHP syntax
        run: find plugin/wpguard-nc-backup -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress Coding Standards
        run: |
          composer global require wp-coding-standards/wpcs --no-interaction || true
          phpcs --standard=WordPress plugin/wpguard-nc-backup || true
      - name: Static analysis
        run: phpstan analyse plugin/wpguard-nc-backup --level=5 || true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Run unit tests (no WordPress bootstrap required)
        run: php tests/unit/run-all.php

  integration-and-restore-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up and provision disposable stack
        # This is the bash/CI equivalent of docker/scripts/bootstrap.ps1
        # (which is written against Windows PowerShell 5.1's legacy
        # ICertificatePolicy cert-bypass API and isn't safely portable to
        # pwsh on the Linux runner). Same steps, same order: generate
        # secrets/certs, bring up containers (gated on DB healthchecks),
        # install WordPress + activate the plugin + seed fixtures on the
        # source site, provision a dedicated non-admin Nextcloud backup
        # account, and configure the plugin with its app password -- all
        # of which run-e2e.sh assumes already happened, same as it does
        # against the long-lived local dev stack bootstrap.ps1 maintains.
        run: |
          cd docker
          cp .env.example .env  # CI uses throwaway generated-in-CI secrets, never real ones
          bash scripts/gen-certs.sh
          docker compose -f docker-compose.yml up -d

          env_val() { grep "^$1=" .env | cut -d= -f2-; }
          WP_SOURCE_DB_NAME=$(env_val WP_SOURCE_DB_NAME)
          WP_SOURCE_DB_USER=$(env_val WP_SOURCE_DB_USER)
          WP_SOURCE_DB_PASSWORD=$(env_val WP_SOURCE_DB_PASSWORD)
          WP_SOURCE_TABLE_PREFIX=$(env_val WP_SOURCE_TABLE_PREFIX)
          WP_ADMIN_USER=$(env_val WP_ADMIN_USER)
          WP_ADMIN_PASSWORD=$(env_val WP_ADMIN_PASSWORD)
          WP_ADMIN_EMAIL=$(env_val WP_ADMIN_EMAIL)
          NC_BACKUP_USER=$(env_val NC_BACKUP_USER)
          NC_BACKUP_USER_PASSWORD=$(env_val NC_BACKUP_USER_PASSWORD)

          wp_source() {
            docker compose run --rm \
              -e WORDPRESS_DB_HOST=db-source -e WORDPRESS_DB_NAME="$WP_SOURCE_DB_NAME" \
              -e WORDPRESS_DB_USER="$WP_SOURCE_DB_USER" -e WORDPRESS_DB_PASSWORD="$WP_SOURCE_DB_PASSWORD" \
              -e WORDPRESS_TABLE_PREFIX="$WP_SOURCE_TABLE_PREFIX" \
              wpcli wp --path=/var/www/html-source "$@"
          }

          echo "Installing WordPress (source)..."
          wp_source core install --url="http://127.0.0.1:8081" --title="WPGuard Source Test Site" \
            --admin_user="$WP_ADMIN_USER" --admin_password="$WP_ADMIN_PASSWORD" --admin_email="$WP_ADMIN_EMAIL" --skip-email

          echo "Activating plugin on source site..."
          wp_source plugin activate wpguard-nc-backup

          echo "Seeding fixture content on source site..."
          wp_source eval-file /fixtures/seed-fixtures.php

          echo "Trusting the dotted internal hostname in Nextcloud..."
          docker compose exec -T nextcloud php occ config:system:set trusted_domains 2 --value="nc-proxy.wpguard-test.local"

          echo "Creating dedicated non-admin Nextcloud backup account..."
          docker compose exec -T -e OC_PASS="$NC_BACKUP_USER_PASSWORD" nextcloud php occ user:add \
            --password-from-env --display-name="WPGuard Backup (dedicated, non-admin)" "$NC_BACKUP_USER"

          echo "Generating Nextcloud app password for the backup account via OCS API..."
          APP_PASSWORD=$(curl -sk --cacert certs/wpguard-test-ca.crt -u "$NC_BACKUP_USER:$NC_BACKUP_USER_PASSWORD" \
            -H 'OCS-APIRequest: true' -H 'Accept: application/json' \
            https://127.0.0.1:8443/ocs/v2.php/core/getapppassword | sed -n 's/.*"apppassword":"\([^"]*\)".*/\1/p')
          if [ -z "$APP_PASSWORD" ]; then echo "failed to obtain Nextcloud app password" >&2; exit 1; fi

          echo "Configuring plugin settings on source site..."
          docker compose run --rm \
            -e WORDPRESS_DB_HOST=db-source -e WORDPRESS_DB_NAME="$WP_SOURCE_DB_NAME" \
            -e WORDPRESS_DB_USER="$WP_SOURCE_DB_USER" -e WORDPRESS_DB_PASSWORD="$WP_SOURCE_DB_PASSWORD" \
            -e WPGUARD_TEST_NC_URL="https://nc-proxy.wpguard-test.local" \
            -e WPGUARD_TEST_NC_USER="$NC_BACKUP_USER" \
            -e WPGUARD_TEST_NC_APP_PASSWORD="$APP_PASSWORD" \
            -e WPGUARD_TEST_NC_FOLDER="wpguard-backups" \
            wpcli wp --path=/var/www/html-source eval-file /fixtures/configure-plugin.php
      - name: Run full backup + restore E2E drill
        run: bash tests/e2e/run-e2e.sh
      - name: Tear down
        if: always()
        run: docker compose -p wpguard-test -f docker/docker-compose.yml down -v

  release:
    # Phase 2 item 10 (CI bash port, release-zip half): builds and attaches
    # the plugin-only zip Update_Checker looks for (see docs/releasing.md).
    # Gated on the same tag-build steps every push already runs, so a
    # broken build/test can never produce a release asset.
    needs: [php-syntax-and-style, unit-tests, integration-and-restore-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build plugin-only zip from the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          git archive --format=zip --prefix=wpguard-nc-backup/ "$TAG:plugin/wpguard-nc-backup" -o "wpguard-nc-backup-${VERSION}.zip"
      - name: Attach to the GitHub Release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: wpguard-nc-backup-*.zip
          # A tag with a `-` suffix (e.g. v1.2.1-rc1) is marked prerelease,
          # which Update_Checker's /releases/latest query never returns --
          # this is how a real tag push can be tested without any live
          # site ever being offered it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
