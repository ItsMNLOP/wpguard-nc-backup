; Disposable test stack only -- not plugin configuration, not a production
; recommendation. Stock PHP defaults (upload_max_filesize=2M,
; post_max_size=8M) are far smaller than a real WPGuard backup bundle,
; which blocks the "Upload a backup bundle" restore path (shipped Phase 2)
; before it ever reaches WordPress -- Apache/PHP itself rejects the
; request. This surfaced via tests/e2e/run-e2e-download-backup.sh, the
; first E2E test to actually exercise a real upload through
; ajax_upload_restore_bundle() rather than only unit-testing its
; path-safety logic. Any real site using either feature needs its own
; hosting configured generously enough for its own backup size -- this
; file only makes the disposable test stack representative of that,
; not a workaround in the plugin itself.
upload_max_filesize = 256M
post_max_size = 256M
