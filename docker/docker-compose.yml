name: wpguard-test

services:
  db-source:
    image: mariadb:11.4
    restart: "no"
    mem_limit: 512m
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_SOURCE_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WP_SOURCE_DB_NAME}
      MARIADB_USER: ${WP_SOURCE_DB_USER}
      MARIADB_PASSWORD: ${WP_SOURCE_DB_PASSWORD}
    volumes:
      - db_source_data:/var/lib/mysql
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  wp-source:
    image: wordpress:7.1-php8.3-apache
    restart: "no"
    mem_limit: 512m
    cpus: 1
    depends_on:
      db-source:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-source
      WORDPRESS_DB_NAME: ${WP_SOURCE_DB_NAME}
      WORDPRESS_DB_USER: ${WP_SOURCE_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_SOURCE_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_SOURCE_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WPTHISTLE_BACKUP_CA_BUNDLE', '/usr/local/share/ca-certificates/wpguard-test-ca.crt');
    volumes:
      - wp_source_html:/var/www/html
      - ../plugin/wpthistle-backup-restore:/var/www/html/wp-content/plugins/wpthistle-backup-restore
      - ./certs:/usr/local/share/ca-certificates:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-wpguard-test-uploads.ini:ro
    ports:
      - "127.0.0.1:8081:80"
    networks: [wpguard-test]

  db-nextcloud:
    image: mariadb:11.4
    restart: "no"
    mem_limit: 512m
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: ${NC_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${NC_DB_NAME}
      MARIADB_USER: ${NC_DB_USER}
      MARIADB_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - db_nextcloud_data:/var/lib/mysql
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  nextcloud:
    image: nextcloud:34-apache
    restart: "no"
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      db-nextcloud:
        condition: service_healthy
    environment:
      MYSQL_HOST: db-nextcloud
      MYSQL_DATABASE: ${NC_DB_NAME}
      MYSQL_USER: ${NC_DB_USER}
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "nc-proxy nc-proxy.wpguard-test.local"
      TRUSTED_PROXIES: 0.0.0.0/0
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nc-proxy
    volumes:
      - nextcloud_data:/var/www/html
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/status.php"]
      interval: 3s
      timeout: 3s
      retries: 60

  nc-proxy:
    image: nginx:alpine
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      nextcloud:
        condition: service_healthy
    volumes:
      - ./nginx/nc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      wpguard-test:
        aliases:
          # wp_http_validate_url() rejects hostnames with no dot (SSRF
          # hardening) - a real Nextcloud hostname always has one, so the
          # test stack needs a dotted alias too rather than weakening the
          # plugin's validation for test convenience.
          - nc-proxy.wpguard-test.local

  # Phase 3 multi-backend probe/test fixtures (ownCloud classic + OpenCloud).
  # Not part of the default stack -- bring up with `--profile multi-backend`.
  db-owncloud:
    image: mariadb:11.4
    restart: "no"
    mem_limit: 512m
    cpus: 1
    profiles: ["multi-backend"]
    environment:
      MARIADB_ROOT_PASSWORD: ${OC_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${OC_DB_NAME}
      MARIADB_USER: ${OC_DB_USER}
      MARIADB_PASSWORD: ${OC_DB_PASSWORD}
    volumes:
      - db_owncloud_data:/var/lib/mysql
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  owncloud:
    image: owncloud/server:10.15
    restart: "no"
    mem_limit: 1g
    cpus: 1.5
    profiles: ["multi-backend"]
    depends_on:
      db-owncloud:
        condition: service_healthy
    environment:
      OWNCLOUD_DB_TYPE: mysql
      OWNCLOUD_DB_HOST: db-owncloud
      OWNCLOUD_DB_NAME: ${OC_DB_NAME}
      OWNCLOUD_DB_USERNAME: ${OC_DB_USER}
      OWNCLOUD_DB_PASSWORD: ${OC_DB_PASSWORD}
      OWNCLOUD_ADMIN_USERNAME: ${OWNCLOUD_ADMIN_USER}
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD}
      OWNCLOUD_DOMAIN: oc-proxy.wpguard-test.local
      # owncloud/server's config.php template does `explode(',', ...)` on
      # this var, not a space-split -- a space-separated value here lands
      # as one unsplit, never-matching trusted-domain string (confirmed
      # live: config.php showed exactly that). Also observed: editing
      # config.php's trusted_domains directly via `occ` on an
      # already-running container did not hold across subsequent `occ`
      # invocations -- each one appeared to re-derive the same broken
      # value from this var. Only a force-recreate of the container
      # (`docker compose ... up -d --force-recreate owncloud`, same data
      # volume, so no reinstall) against the corrected comma-separated
      # value actually fixed it.
      OWNCLOUD_TRUSTED_DOMAINS: "owncloud,oc-proxy,oc-proxy.wpguard-test.local"
      OWNCLOUD_OVERWRITEPROTOCOL: https
    volumes:
      - owncloud_data:/mnt/data
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/status.php"]
      interval: 3s
      timeout: 3s
      retries: 60

  oc-proxy:
    image: nginx:alpine
    restart: "no"
    mem_limit: 128m
    cpus: 0.5
    profiles: ["multi-backend"]
    depends_on:
      owncloud:
        condition: service_healthy
    volumes:
      - ./nginx/oc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8444:443"
    networks:
      wpguard-test:
        aliases:
          - oc-proxy.wpguard-test.local

  opencloud:
    image: opencloudeu/opencloud:7.2.4
    restart: "no"
    mem_limit: 1g
    cpus: 1.5
    profiles: ["multi-backend"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "opencloud init --insecure false || true; exec opencloud server"
    environment:
      OC_URL: https://opencloud.wpguard-test.local:9200
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD}
      PROXY_TRANSPORT_TLS_CERT: /certs/opencloud.pem
      PROXY_TRANSPORT_TLS_KEY: /certs/opencloud.key
      # OpenCloud's own internal services call each other over HTTPS on
      # this same container (e.g. frontend -> data service), even though
      # PROXY_TRANSPORT_TLS_CERT only serves the external-facing listener
      # -- so Go's x509 verifier needs the test CA too, or those internal
      # calls fail (status 500 on PUT, confirmed live). The container
      # runs as a non-root user with no write access to the system trust
      # store, so SSL_CERT_FILE (which Go's crypto/x509 honors directly
      # on Linux) is used instead of update-ca-certificates. Trusting a
      # CA this plugin's own test fixtures generated, not disabling
      # verification (ADR 0007's spirit, even though this self-call path
      # is OpenCloud-internal, never the plugin's own).
      SSL_CERT_FILE: /certs/wpguard-test-ca.crt
    volumes:
      - opencloud_data:/var/lib/opencloud
      - opencloud_config:/etc/opencloud
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      wpguard-test:
        aliases:
          - opencloud.wpguard-test.local

  db-restore:
    image: mariadb:11.4
    restart: "no"
    mem_limit: 512m
    cpus: 1
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_RESTORE_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WP_RESTORE_DB_NAME}
      MARIADB_USER: ${WP_RESTORE_DB_USER}
      MARIADB_PASSWORD: ${WP_RESTORE_DB_PASSWORD}
    volumes:
      - db_restore_data:/var/lib/mysql
    networks: [wpguard-test]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  wp-restore:
    image: wordpress:7.1-php8.3-apache
    restart: "no"
    mem_limit: 512m
    cpus: 1
    depends_on:
      db-restore:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-restore
      WORDPRESS_DB_NAME: ${WP_RESTORE_DB_NAME}
      WORDPRESS_DB_USER: ${WP_RESTORE_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_RESTORE_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_RESTORE_TABLE_PREFIX}
    volumes:
      - wp_restore_html:/var/www/html
      # Phase 2 (one-click restore E2E only): wp-restore is already
      # freshly re-provisioned (wp core install) by every test that
      # touches it, unlike wp-source which is a stable fixture other
      # E2E scripts depend on -- so this is the safe target for a real
      # in-place restore test, not wp-source.
      - ../plugin/wpthistle-backup-restore:/var/www/html/wp-content/plugins/wpthistle-backup-restore
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/zz-wpguard-test-uploads.ini:ro
    ports:
      - "127.0.0.1:8082:80"
    networks: [wpguard-test]

  wpcli:
    image: wordpress:cli
    restart: "no"
    mem_limit: 512m
    cpus: 1
    user: "33:33"
    environment:
      # wp-config.php calls getenv_docker() live on every request (it is
      # not a one-time-rendered file), so this must match wp-source's own
      # setting whenever wpcli operates on html-source (ADR 0007's CA
      # trust path and the DB_* vars below for the same reason).
      WORDPRESS_CONFIG_EXTRA: |
        define('WPTHISTLE_BACKUP_CA_BUNDLE', '/usr/local/share/ca-certificates/wpguard-test-ca.crt');
    volumes:
      - wp_source_html:/var/www/html-source
      - ../plugin/wpthistle-backup-restore:/var/www/html-source/wp-content/plugins/wpthistle-backup-restore
      - wp_restore_html:/var/www/html-restore
      # Phase 2 (one-click restore E2E): wpcli never had the plugin
      # mounted into its own html-restore path at all -- only the
      # wp-restore apache service did -- so `wp` commands against
      # --path=/var/www/html-restore ran against whatever static files
      # happened to already be in the wp_restore_html volume (stale
      # leftovers from an earlier manual-unzip restore drill), not a
      # live view of this repo. Found live when a freshly emptied
      # volume made that gap obvious (every class simply missing).
      - ../plugin/wpthistle-backup-restore:/var/www/html-restore/wp-content/plugins/wpthistle-backup-restore
      - ./certs:/certs:ro
      - ./certs:/usr/local/share/ca-certificates:ro
      - ../tests/fixtures:/fixtures:ro
    networks: [wpguard-test]

volumes:
  db_source_data:
  wp_source_html:
  db_nextcloud_data:
  nextcloud_data:
  db_owncloud_data:
  owncloud_data:
  opencloud_data:
  opencloud_config:
  db_restore_data:
  wp_restore_html:

networks:
  wpguard-test:
    name: wpguard-test
