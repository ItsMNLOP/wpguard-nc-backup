name: wpguard-test

services:
  db-source:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_SOURCE_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WP_SOURCE_DB_NAME}
      MARIADB_USER: ${WP_SOURCE_DB_USER}
      MARIADB_PASSWORD: ${WP_SOURCE_DB_PASSWORD}
    volumes:
      - db_source_data:/var/lib/mysql
    networks: [wpguard-test]

  wp-source:
    image: wordpress:7.1-php8.3-apache
    restart: "no"
    depends_on: [db-source]
    environment:
      WORDPRESS_DB_HOST: db-source
      WORDPRESS_DB_NAME: ${WP_SOURCE_DB_NAME}
      WORDPRESS_DB_USER: ${WP_SOURCE_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_SOURCE_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_SOURCE_TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WPGUARD_NC_CA_BUNDLE', '/usr/local/share/ca-certificates/wpguard-test-ca.crt');
    volumes:
      - wp_source_html:/var/www/html
      - ../plugin/wpguard-nc-backup:/var/www/html/wp-content/plugins/wpguard-nc-backup
      - ./certs:/usr/local/share/ca-certificates:ro
    ports:
      - "127.0.0.1:8081:80"
    networks: [wpguard-test]

  db-nextcloud:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${NC_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${NC_DB_NAME}
      MARIADB_USER: ${NC_DB_USER}
      MARIADB_PASSWORD: ${NC_DB_PASSWORD}
    volumes:
      - db_nextcloud_data:/var/lib/mysql
    networks: [wpguard-test]

  nextcloud:
    image: nextcloud:34-apache
    restart: "no"
    depends_on: [db-nextcloud]
    environment:
      MYSQL_HOST: db-nextcloud
      MYSQL_DATABASE: ${NC_DB_NAME}
      MYSQL_USER: ${NC_DB_USER}
      MYSQL_PASSWORD: ${NC_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nc-proxy
      TRUSTED_PROXIES: 0.0.0.0/0
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nc-proxy
    volumes:
      - nextcloud_data:/var/www/html
    networks: [wpguard-test]

  nc-proxy:
    image: nginx:alpine
    restart: "no"
    depends_on: [nextcloud]
    volumes:
      - ./nginx/nc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      wpguard-test:
        aliases:
          # wp_http_validate_url() rejects hostnames with no dot (SSRF
          # hardening) - a real Nextcloud hostname always has one, so the
          # test stack needs a dotted alias too rather than weakening the
          # plugin's validation for test convenience.
          - nc-proxy.wpguard-test.local

  db-restore:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_RESTORE_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WP_RESTORE_DB_NAME}
      MARIADB_USER: ${WP_RESTORE_DB_USER}
      MARIADB_PASSWORD: ${WP_RESTORE_DB_PASSWORD}
    volumes:
      - db_restore_data:/var/lib/mysql
    networks: [wpguard-test]

  wp-restore:
    image: wordpress:7.1-php8.3-apache
    restart: "no"
    depends_on: [db-restore]
    environment:
      WORDPRESS_DB_HOST: db-restore
      WORDPRESS_DB_NAME: ${WP_RESTORE_DB_NAME}
      WORDPRESS_DB_USER: ${WP_RESTORE_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_RESTORE_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_RESTORE_TABLE_PREFIX}
    volumes:
      - wp_restore_html:/var/www/html
    ports:
      - "127.0.0.1:8082:80"
    networks: [wpguard-test]

  wpcli:
    image: wordpress:cli
    restart: "no"
    user: "33:33"
    volumes:
      - wp_source_html:/var/www/html-source
      - ../plugin/wpguard-nc-backup:/var/www/html-source/wp-content/plugins/wpguard-nc-backup
      - wp_restore_html:/var/www/html-restore
      - ./certs:/certs:ro
      - ../tests/fixtures:/fixtures:ro
    networks: [wpguard-test]

volumes:
  db_source_data:
  wp_source_html:
  db_nextcloud_data:
  nextcloud_data:
  db_restore_data:
  wp_restore_html:

networks:
  wpguard-test:
    name: wpguard-test
