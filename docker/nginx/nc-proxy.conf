server {
    listen 443 ssl;
    server_name nc-proxy;

    ssl_certificate     /certs/nc-proxy.pem;
    ssl_certificate_key /certs/nc-proxy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4G;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://nextcloud:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # $http_host (not $host) preserves the port the client actually
        # used (e.g. 127.0.0.1:8443) - $host strips it, which made
        # Nextcloud's redirects drop the port and send browsers to
        # https://127.0.0.1/ (port 443, nothing listening there).
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
